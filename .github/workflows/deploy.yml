name: Déploiement GitHub Pages

# Vérifie types, lint et tests sur chaque pull request ET chaque push sur la
# branche principale ; ne déploie sur GitHub Pages que dans ce second cas (voir
# le `if` du job deploy) — une pull request valide son code sans jamais publier.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Calcule le base path : vide pour une page utilisateur/orga
      # (dépôt `user.github.io`), sinon "/<nom-du-dépôt>" pour une page de projet.
      - name: Calculer le base path
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            echo "PAGES_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE_PATH=/$REPO" >> "$GITHUB_ENV"
          fi

      - run: npm ci

      # --- Garde-fous : rien ne part en production sans ces trois feux verts. ---
      - name: Vérification des types
        run: npm run typecheck

      - name: Analyse statique (lint)
        run: npm run lint

      - name: Tests unitaires
        run: npm run test

      - run: npm run build   # next build → export statique dans ./out (lit PAGES_BASE_PATH)
        env:
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_ENDPOINT }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    # Jamais depuis une pull request : seul un push sur la branche principale publie.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
